name: Bug report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide enough detail to help us reproduce and investigate it.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of the problem.
      placeholder: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Provide ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message or traceback
      description: If applicable, paste the complete Python traceback.
      render: python
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Which Python version are you using?
      placeholder: "3.12.7"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Which operating system are you using?
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include relevant logs, configuration, or screenshots.
    validations:
      required: false
