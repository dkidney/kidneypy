[project]
name = "kidneypy"
dynamic = ["version"]
requires-python = ">=3.12.13"
authors = [
    { name = "dkidney" }
]
description = "Miscellaneous helpers"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidneypy"]

[tool.hatch.version]
path = "src/kidneypy/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "dist",
    "build",
    "__pycache__",
    ".git",
    "data",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: common style errors and PEP 8 violations
    "F",   # Pyflakes: undefined names, unused imports, and other likely errors
    "I",   # isort: import sorting and grouping
    "B",   # flake8-bugbear: likely bugs and questionable coding patterns
    "UP",  # pyupgrade: outdated syntax and modernisation suggestions
    "SIM", # flake8-simplify: unnecessarily complex or redundant code
]

[tool.ruff.lint.isort]
known-first-party = ["kidneypy"]
